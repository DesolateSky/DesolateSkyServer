player-join: "<prefix> >> <text-color>Welcome back to Desolate Sky! Use /discord to join the discord."
new-player-join:"""<prefix> >> Welcome to Desolate Sky! Use /is create to get started, or /is join if you are playing with someone else.
The server is still in alpha so expect plenty of bugs. If you find a bug and would like to report it, please join the discord by using /discord.
If you are interested in the story, use /story to learn the story. This isn't needed for progression.
Please read the /rules, and have fun."""

new-player-join-welcome: "<prefix> >> <text-color>Welcome <player> to Desolate Sky!"
player-join-welcome-back: "<prefix> >> <text-color><player> joined Desolate Sky."
player-leave: "<prefix> >> <text-color><player> has left Deolate Sky."

rules: [
  "<prefix> <primary-color><bold>Rules"
  "<text-color>1. Do not purposefully abuse any bugs (especially if the bug impacts other players' gameplay).",
  "<text-color>2. Do not build anything innapropriate or say anything innapropriate.",
  "<text-color>3. Do not bypass the chat filter (excluding false positives, in that case report it to a staff member).",
  "<text-color>4. Do not be rude or mean to other server members. If you have an issue with a player, please let a staff member know and they will handle it."
]

pl-message: ["https://github.com/DesolateSky/DesolateSkyServer"]

tutorial: """<prefix> >> <text-color>Create an island using /is create, or join someone else's island using /is join. You can invite other people to your island by doing
/is invite <player>. If you need more help, please join the discord. The server is still in alpha, so expect bugs.
"""

story: """<text-color>The Overworld has been infected by the void. This has caused all mobs to become infected and aggressive. You have been sent to a new dimension
<text-color>to try to create a buffer between the void and the Overworld. The dimension is connected to the void, but seems to be safe from corruption. Your mission is
<text-color>to hold back the void and allow the Overworld to be saved."""